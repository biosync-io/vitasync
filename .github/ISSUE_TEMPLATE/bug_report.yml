name: Bug Report
description: Report a bug in VitaSync
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API (Fastify backend)
        - Web (Next.js frontend)
        - Worker (BullMQ processor)
        - MCP Server
        - Providers (Fitbit, Strava, etc.)
        - Database / Migrations
        - Helm Chart
        - Docker / Docker Compose
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, Docker version, etc.
      placeholder: |
        - OS: Ubuntu 22.04
        - Node.js: 22.x
        - Browser: Chrome 120
        - Docker: 24.0.7
        - pnpm: 10.x
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (use code blocks).
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
