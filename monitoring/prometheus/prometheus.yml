# VitaSync — Prometheus Configuration
#
# Scrapes metrics from infrastructure exporters.
# Health-data dashboards use direct PostgreSQL queries in Grafana,
# so Prometheus is focused on infrastructure observability.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── PostgreSQL Exporter ──────────────────────────────────────────────────
  # Exposes connection pool stats, replication lag, table sizes, locks,
  # and custom VitaSync queries defined in postgres-queries.yml.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: vitasync-db

  # ── Redis Exporter ──────────────────────────────────────────────────────
  # Exposes memory usage, connected clients, keyspace stats,
  # command latencies, and eviction metrics.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: vitasync-cache

  # ── Node Exporter (Linux host metrics) ──────────────────────────────────
  # CPU, memory, disk I/O, network, filesystem usage.
  # Only available on Linux hosts.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: vitasync-host

  # ── Prometheus self-monitoring ──────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
