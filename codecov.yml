codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  api:
    paths:
      - apps/api/src/
    carryforward: true

ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/__tests__/**"
  - "**/coverage/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
