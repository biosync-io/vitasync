{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-ingressroute
  namespace: {{ .Values.ingressRoute.namespace | default .Release.Namespace }}
  {{- if .Values.ingressRoute.annotations }}
  annotations:
{{ toYaml .Values.ingressRoute.annotations | indent 4 }}
  {{- end }}
spec:
  entryPoints:
{{ toYaml .Values.ingressRoute.entryPoints | indent 4 }}
  routes:
  {{- range .Values.ingressRoute.routes }}
    - match: {{ .match }}
      kind: {{ .kind | default "Rule" }}
      {{- if .middlewares }}
      middlewares:
      {{- range .middlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace | default $.Values.ingressRoute.namespace }}
      {{- end }}
      {{- end }}
      services:
      {{- range .services }}
        - name: {{ .name }}
          namespace: {{ .namespace | default $.Values.ingressRoute.namespace }}
          port: {{ .port }}
      {{- end }}
  {{- end }}
  {{- if .Values.ingress.admin.enabled }}
    - match: Host(`{{ .Values.ingress.admin.host }}`)
      kind: Rule
      {{- $adminMiddlewares := list }}
      {{- if .Values.ingress.admin.ipAllowList.enabled }}
      {{- $adminMiddlewares = append $adminMiddlewares (dict "name" (printf "%s-admin-ip-allowlist" .Release.Name) "namespace" .Release.Namespace) }}
      {{- end }}
      {{- if .Values.ingress.admin.rateLimit.enabled }}
      {{- $adminMiddlewares = append $adminMiddlewares (dict "name" (printf "%s-admin-rate-limit" .Release.Name) "namespace" .Release.Namespace) }}
      {{- end }}
      {{- if $adminMiddlewares }}
      middlewares:
      {{- range $adminMiddlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace }}
      {{- end }}
      {{- end }}
      services:
        - name: {{ include "vitasync.fullname" . }}-web
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.web.service.port | default 3000 }}
  {{- end }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    {{- if .Values.ingressRoute.tls.secretName }}
    secretName: {{ .Values.ingressRoute.tls.secretName }}
    {{- end }}
    {{- if .Values.ingressRoute.tls.certResolver }}
    certResolver: {{ .Values.ingressRoute.tls.certResolver }}
    {{- end }}
    {{- if .Values.ingressRoute.tls.domains }}
    domains:
    {{- range .Values.ingressRoute.tls.domains }}
      - main: {{ .main }}
        sans:
          {{- range .sans }}
          - {{ . }}
          {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
