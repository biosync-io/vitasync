{{- if and .Values.ingress.admin.enabled .Values.ingress.admin.ipAllowList.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-admin-ip-allowlist
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
    {{- range .Values.ingress.admin.ipAllowList.sourceRange }}
      - {{ . | quote }}
    {{- end }}
{{- end }}
