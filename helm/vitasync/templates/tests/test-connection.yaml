apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vitasync.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vitasync.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-api
      image: busybox:1.37
      command: ['sh', '-c']
      args:
        - wget --spider --timeout=5 http://{{ include "vitasync.fullname" . }}-api:{{ .Values.api.service.port }}/health
    {{- if .Values.web.enabled }}
    - name: test-web
      image: busybox:1.37
      command: ['sh', '-c']
      args:
        - wget --spider --timeout=5 http://{{ include "vitasync.fullname" . }}-web:{{ .Values.web.service.port }}/
    {{- end }}
